      Developed by **[Dr. Pratheesh P. Gopinath](https://agstatistics.com/faculty.html#sub-lt-dr-pratheesh-p-gopinath)** · Contact: [pratheesh.pg@kau.in](mailto:pratheesh.pg@kau.in)
