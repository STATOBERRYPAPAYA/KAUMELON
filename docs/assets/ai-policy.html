<!-- Appear in search, but keep AI answers and previews short:
     max-snippet limits how much text Google Search, AI Overviews and Bing/Copilot may quote.
     noai / noimageai ask other AI tools not to use the content. -->
<meta name="robots" content="index, follow, max-snippet:160, max-image-preview:large, noai, noimageai">
